<style>
  .profil-wilayah-container {
    width: 100%;
    max-width: 1000px;
    margin: 0 auto;
    padding-bottom: 180px !important;
    box-sizing: border-box;
  }

  .btn-back-link {
    background: none;
    border: none;
    color: #00796B;
    font-weight: 700;
    cursor: pointer;
    font-size: 13px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 0;
    margin-bottom: 14px;
  }

  .wilayah-header-title {
    color: #00796B;
    font-size: 22px;
    font-weight: 800;
    margin: 0;
  }

  .wilayah-header-subtitle {
    color: #64748B;
    font-size: 12px;
    margin-top: 4px;
    margin-bottom: 22px;
  }

  .wilayah-card {
    background: #FFFFFF;
    border-radius: 18px;
    border: 1px solid #E2E8F0;
    padding: 22px;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.02);
    margin-bottom: 20px;
  }

  .section-divider-title {
    font-size: 12px;
    font-weight: 800;
    color: #00796B;
    letter-spacing: 0.6px;
    text-transform: uppercase;
    margin-bottom: 18px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .form-group-custom {
    margin-bottom: 16px;
    width: 100%;
  }

  .form-group-custom label {
    display: block;
    font-size: 11px;
    font-weight: 700;
    color: #475467;
    letter-spacing: 0.5px;
    margin-bottom: 6px;
    text-transform: uppercase;
  }

  .input-custom {
    width: 100%;
    padding: 11px 14px;
    font-size: 13px;
    color: #0F172A;
    background-color: #F8FAFC;
    border: 1.5px solid #E2E8F0;
    border-radius: 10px;
    outline: none;
    box-sizing: border-box;
  }

  textarea.input-custom {
    resize: vertical;
    min-height: 95px;
    font-family: inherit;
  }

  .grid-two-col {
    display: flex !important;
    flex-wrap: wrap !important;
    gap: 16px !important;
    width: 100% !important;
    margin-bottom: 16px;
  }

  .grid-two-col > .form-group-custom {
    flex: 1 1 calc(50% - 8px) !important;
    min-width: 220px !important;
    margin-bottom: 0;
  }

  .rt-item-card {
    background-color: #F8FAFC;
    border: 1px solid #E2E8F0;
    border-radius: 14px;
    padding: 18px;
    margin-bottom: 16px;
  }

  .rt-item-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
    padding-bottom: 10px;
    border-bottom: 1px dashed #E2E8F0;
  }

  .rt-item-title-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background-color: #E8F5E9;
    color: #00796B;
    font-size: 11.5px;
    font-weight: 800;
    padding: 4px 10px;
    border-radius: 8px;
  }

  .btn-remove-rt {
    background-color: #FEE2E2;
    color: #DC2626;
    border: none;
    border-radius: 8px;
    padding: 6px 12px;
    font-size: 11.5px;
    font-weight: 700;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }

  .btn-add-rt {
    width: 100%;
    padding: 12px;
    background-color: #F0FDF4;
    color: #00796B;
    border: 1.5px dashed #00796B;
    border-radius: 12px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }

  /* TOMBOL SIMPAN DIBAUAT JELAS DI BAWAH */
  .btn-submit-primary {
    width: 100%;
    padding: 14px;
    background-color: #00796B;
    color: #FFFFFF;
    border: none;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 800;
    cursor: pointer;
    margin-top: 24px;
    margin-bottom: 80px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    box-shadow: 0 4px 14px rgba(0, 121, 107, 0.3);
  }

  .btn-submit-primary:hover {
    background-color: #004D40;
  }
</style>

<div class="profil-wilayah-container">

  <button type="button" onclick="window.switchPage('more')" class="btn-back-link">
    ← Kembali ke Lainnya
  </button>

  <h2 class="wilayah-header-title">Profil Wilayah</h2>
  <p class="wilayah-header-subtitle">Kelola informasi umum dan identitas administrasi wilayah setempat.</p>

  <form id="form-profil-wilayah">

    <!-- CARD 1: IDENTITAS ADMINISTRASI -->
    <div class="wilayah-card">
      <div class="section-divider-title">
        🌐 IDENTITAS ADMINISTRASI
      </div>

      <div class="form-group-custom">
        <label>PEDUKUHAN</label>
        <input type="text" id="wilayah-pedukuhan" class="input-custom" placeholder="Tulung">
      </div>

      <div class="form-group-custom">
        <label>DESA / KELURAHAN</label>
        <input type="text" id="wilayah-desa" class="input-custom" placeholder="Srihardono">
      </div>

      <div class="grid-two-col">
        <div class="form-group-custom">
          <label>KECAMATAN</label>
          <input type="text" id="wilayah-kecamatan" class="input-custom" placeholder="Pundong">
        </div>

        <div class="form-group-custom">
          <label>KABUPATEN / KOTA</label>
          <input type="text" id="wilayah-kabupaten" class="input-custom" placeholder="Bantul">
        </div>
      </div>

      <div class="grid-two-col">
        <div class="form-group-custom">
          <label>PROVINSI</label>
          <input type="text" id="wilayah-provinsi" class="input-custom" placeholder="Yogyakarta">
        </div>

        <div class="form-group-custom">
          <label>KODE POS</label>
          <input type="text" id="wilayah-kodepos" class="input-custom" placeholder="55771">
        </div>
      </div>

      <div class="form-group-custom" style="margin-bottom: 0;">
        <label>DESKRIPSI (TENTANG WILAYAH)</label>
        <textarea id="wilayah-deskripsi" class="input-custom" rows="3" placeholder="Tuliskan deskripsi wilayah..."></textarea>
      </div>
    </div>

    <!-- CARD 2: STRUKTUR ORGANISASI -->
    <div class="wilayah-card">
      <div class="section-divider-title">
        👥 STRUKTUR ORGANISASI PEDUKUHAN
      </div>

      <div class="grid-two-col" style="margin-bottom: 20px;">
        <div class="form-group-custom">
          <label>NAMA DUKUH</label>
          <input type="text" id="dukuh-nama" class="input-custom" placeholder="Nama Dukuh">
        </div>
        <div class="form-group-custom">
          <label>KONTAK DUKUH (WA)</label>
          <input type="text" id="dukuh-kontak" class="input-custom" placeholder="08xxx">
        </div>
      </div>

      <!-- CONTAINER DAFTAR RT -->
      <div id="container-list-rt"></div>

      <button type="button" id="btn-tambah-rt" class="btn-add-rt">
        + Tambah RT Baru
      </button>
    </div>

    <!-- TOMBOL SIMPAN DI DALAM FORM -->
    <button type="submit" id="btn-simpan-profil" class="btn-submit-primary">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
        <polyline points="17 21 17 13 7 13 7 21"></polyline>
        <polyline points="7 3 7 8 15 8"></polyline>
      </svg>
      <span>Simpan Ke Firestore</span>
    </button>

  </form>

</div>
