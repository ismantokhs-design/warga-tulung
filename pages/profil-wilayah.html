<style>
  .profil-wilayah-container {
    padding-bottom: 24px;
    animation: fadeInWilayah 0.25s ease-out;
  }

  @keyframes fadeInWilayah {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Toast Notification Custom WargaKu */
  .wargaku-toast {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%) translateY(-20px);
    background-color: #00796B;
    color: #FFFFFF;
    padding: 12px 18px;
    border-radius: 14px;
    box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.15), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 13px;
    font-weight: 600;
    z-index: 10000;
    opacity: 0;
    visibility: hidden;
    transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    max-width: 90%;
    white-space: nowrap;
  }

  .wargaku-toast.show {
    opacity: 1;
    visibility: visible;
    transform: translateX(-50%) translateY(0);
  }

  .wargaku-toast.error {
    background-color: #E02424;
  }

  /* Back Button Header */
  .btn-back-link {
    background: none;
    border: none;
    color: #00796B;
    font-weight: 700;
    cursor: pointer;
    font-size: 13px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 0;
    margin-bottom: 14px;
    transition: transform 0.15s ease;
  }

  .btn-back-link:hover {
    transform: translateX(-3px);
  }

  /* Header Title */
  .wilayah-header-title {
    color: #00796B;
    font-size: 20px;
    font-weight: 800;
    margin: 0;
  }

  .wilayah-header-subtitle {
    color: #64748B;
    font-size: 12px;
    margin-top: 3px;
    margin-bottom: 18px;
  }

  /* Card Box */
  .wilayah-card {
    background: #FFFFFF;
    border-radius: 18px;
    border: 1px solid #E2E8F0;
    padding: 20px 18px;
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.03);
    margin-bottom: 16px;
  }

  .section-divider-title {
    font-size: 12px;
    font-weight: 800;
    color: #00796B;
    letter-spacing: 0.6px;
    text-transform: uppercase;
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  /* Form Elements */
  .form-group-custom {
    margin-bottom: 16px;
  }

  .form-group-custom label {
    display: block;
    font-size: 11px;
    font-weight: 700;
    color: #475467;
    letter-spacing: 0.5px;
    margin-bottom: 6px;
  }

  .input-custom {
    width: 100%;
    padding: 10px 12px;
    font-size: 13px;
    color: #0F172A;
    background-color: #F8FAFC;
    border: 1.5px solid #E2E8F0;
    border-radius: 10px;
    outline: none;
    box-sizing: border-box;
    transition: all 0.2s ease;
  }

  .input-custom:focus {
    background-color: #FFFFFF;
    border-color: #00796B;
    box-shadow: 0 0 0 3px rgba(0, 121, 107, 0.12);
  }

  /* Grid 2 Kolom */
  .grid-two-col {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  /* Dynamic Item Card RT */
  .rt-item-card {
    background-color: #F8FAFC;
    border: 1px dashed #CBD5E1;
    border-radius: 14px;
    padding: 14px;
    margin-bottom: 12px;
    position: relative;
  }

  .rt-item-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }

  .rt-item-title {
    font-size: 12px;
    font-weight: 700;
    color: #0F172A;
  }

  .btn-remove-rt {
    background: #FEE2E2;
    color: #DC2626;
    border: none;
    border-radius: 8px;
    padding: 4px 10px;
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.15s ease;
  }

  .btn-remove-rt:hover {
    background: #FCA5A5;
  }

  /* Buttons */
  .btn-add-rt {
    width: 100%;
    padding: 10px;
    background-color: #E8F5E9;
    color: #00796B;
    border: 1.5px dashed #00796B;
    border-radius: 10px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    margin-bottom: 16px;
  }

  .btn-add-rt:hover {
    background-color: #C8E6C9;
  }

  .btn-submit-primary {
    width: 100%;
    padding: 12px;
    background-color: #00796B;
    color: #FFFFFF;
    border: none;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    transition: background-color 0.2s ease, transform 0.1s ease;
    margin-top: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  .btn-submit-primary:hover {
    background-color: #004D40;
  }

  .btn-submit-primary:active {
    transform: scale(0.99);
  }

  @keyframes spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
</style>

<div class="profil-wilayah-container">

  <!-- TOAST NOTIFIKASI MENGAMBANG HASIL SIMPAN -->
  <div id="toast-profil-wilayah" class="wargaku-toast">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
      <polyline points="22 4 12 14.01 9 11.01"></polyline>
    </svg>
    <span id="toast-message">Profil Wilayah berhasil disimpan!</span>
  </div>

  <!-- TOMBOL KEMBALI -->
  <button type="button" onclick="window.switchPage('more')" class="btn-back-link">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <line x1="19" y1="12" x2="5" y2="12"></line>
      <polyline points="12 19 5 12 12 5"></polyline>
    </svg>
    Kembali ke Lainnya
  </button>

  <!-- HEADER JUDUL -->
  <h2 class="wilayah-header-title">Profil Wilayah</h2>
  <p class="wilayah-header-subtitle">Kelola informasi umum dan identitas administrasi wilayah setempat.</p>

  <form id="form-profil-wilayah">

    <!-- CARD 1: INFORMASI WILAYAH UTAMA -->
    <div class="wilayah-card">
      <div class="section-divider-title">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
          <circle cx="12" cy="10" r="3"></circle>
        </svg>
        Identitas Administrasi
      </div>

      <!-- PEDUKUHAN -->
      <div class="form-group-custom">
        <label>PEDUKUHAN</label>
        <input type="text" id="wilayah-pedukuhan" class="input-custom" placeholder="Contoh: Potrobayan" required>
      </div>

      <!-- DESA / KELURAHAN -->
      <div class="form-group-custom">
        <label>DESA / KELURAHAN</label>
        <input type="text" id="wilayah-desa" class="input-custom" placeholder="Contoh: Srihardono" required>
      </div>

      <!-- KECAMATAN & KABUPATEN -->
      <div class="grid-two-col">
        <div class="form-group-custom">
          <label>KECAMATAN</label>
          <input type="text" id="wilayah-kecamatan" class="input-custom" placeholder="Contoh: Pundong" required>
        </div>

        <div class="form-group-custom">
          <label>KABUPATEN / KOTA</label>
          <input type="text" id="wilayah-kabupaten" class="input-custom" placeholder="Contoh: Bantul" required>
        </div>
      </div>

      <!-- PROVINSI & KODE POS -->
      <div class="grid-two-col">
        <div class="form-group-custom">
          <label>PROVINSI</label>
          <input type="text" id="wilayah-provinsi" class="input-custom" placeholder="Contoh: D.I. Yogyakarta" required>
        </div>

        <div class="form-group-custom">
          <label>KODE POS</label>
          <input type="text" id="wilayah-kodepos" class="input-custom" placeholder="Contoh: 55762" required>
        </div>
      </div>

      <!-- DESKRIPSI (TENTANG WILAYAH) -->
      <div class="form-group-custom">
        <label>DESKRIPSI (TENTANG WILAYAH)</label>
        <textarea id="wilayah-deskripsi" class="input-custom" rows="3" placeholder="Tuliskan ringkasan profil, sejarah singkat, atau gambaran umum wilayah..." style="resize: vertical; font-family: inherit;"></textarea>
      </div>
    </div>

    <!-- CARD 2: STRUKTUR ORGANISASI DUKUH & RT -->
    <div class="wilayah-card">
      <div class="section-divider-title">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
          <circle cx="9" cy="7" r="4"></circle>
          <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
          <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
        </svg>
        Struktur Organisasi Pedukuhan
      </div>

      <!-- DUKUH -->
      <div class="grid-two-col">
        <div class="form-group-custom">
          <label>NAMA DUKUH</label>
          <input type="text" id="dukuh-nama" class="input-custom" placeholder="Contoh: Pak Supri">
        </div>
        <div class="form-group-custom">
          <label>KONTAK DUKUH (WA)</label>
          <input type="text" id="dukuh-kontak" class="input-custom" placeholder="08123456789">
        </div>
      </div>

      <!-- CONTAINER REPEATER RT DINAMIS -->
      <div style="font-size: 11px; font-weight: 700; color: #475467; letter-spacing: 0.5px; margin-bottom: 8px;">
        DAFTAR RT & PENGURUS
      </div>

      <div id="container-list-rt">
        <!-- BARIS RT AKAN DITAMBAHKAN SECARA DINAMIS LEWAT JAVASCRIPT -->
      </div>

      <!-- TOMBOL TAMBAH BARIS RT -->
      <button type="button" id="btn-tambah-rt" class="btn-add-rt">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
        Tambah RT Baru
      </button>
    </div>

    <!-- SUBMIT BUTTON -->
    <button type="submit" id="btn-simpan-profil" class="btn-submit-primary">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
        <polyline points="17 21 17 13 7 13 7 21"></polyline>
        <polyline points="7 3 7 8 15 8"></polyline>
      </svg>
      Simpan Ke Firestore
    </button>

  </form>

</div>
