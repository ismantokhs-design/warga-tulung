<style>
  .notulen-page-container {
    padding: 0 0 20px 0;
    animation: fadeInPage 0.2s ease-out;
  }

  @keyframes fadeInPage {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .notulen-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
    gap: 12px;
  }

  .notulen-title {
    font-size: 18px;
    font-weight: 800;
    color: #0F172A;
    margin: 0;
  }

  .notulen-subtitle {
    font-size: 11px;
    color: #64748B;
    margin-top: 2px;
  }

  .btn-tambah-notulen {
    background-color: #00875A;
    color: #FFFFFF;
    border: none;
    border-radius: 12px;
    padding: 8px 14px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    box-shadow: 0 2px 6px rgba(0, 135, 90, 0.2);
    transition: background 0.15s ease;
    white-space: nowrap;
  }

  .btn-tambah-notulen:hover {
    background-color: #00796B;
  }

  .notulen-cards-grid {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .notulen-card {
    background: #FFFFFF;
    border-radius: 16px;
    padding: 14px 16px;
    border: 1px solid #E2E8F0;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .notulen-card-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 10px;
  }

  .notulen-card-title {
    font-size: 15px;
    font-weight: 800;
    color: #0F172A;
    margin: 0;
  }

  .notulen-badge-tgl {
    background-color: #EFF6FF;
    color: #2563EB;
    font-size: 10.5px;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 8px;
    white-space: nowrap;
  }

  .notulen-meta {
    font-size: 11px;
    color: #64748B;
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
  }

  .notulen-meta-item {
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .notulen-isi {
    font-size: 12px;
    color: #334155;
    line-height: 1.4;
    white-space: pre-line;
    background-color: #F8FAFC;
    padding: 10px;
    border-radius: 10px;
    border: 1px solid #F1F5F9;
  }

  .notulen-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 4px;
  }

  .btn-action-icon {
    background: none;
    border: none;
    cursor: pointer;
    font-size: 14px;
    padding: 4px 8px;
    border-radius: 6px;
    transition: background 0.15s ease;
  }

  .btn-action-icon:hover {
    background-color: #F1F5F9;
  }

  /* MODAL STYLES */
  .modal-notulen-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100dvh;
    background: rgba(15, 23, 42, 0.4);
    backdrop-filter: blur(4px);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 9999;
    padding: 16px;
  }

  .modal-notulen-overlay.active {
    display: flex;
  }

  .modal-notulen-content {
    background: #FFFFFF;
    border-radius: 20px;
    width: 100%;
    max-width: 500px;
    padding: 20px;
    box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
    display: flex;
    flex-direction: column;
    gap: 14px;
    max-height: 90dvh;
    overflow-y: auto;
  }

  .modal-header-text {
    font-size: 16px;
    font-weight: 800;
    color: #0F172A;
  }

  .form-group-notulen {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .form-group-notulen label {
    font-size: 11.5px;
    font-weight: 700;
    color: #475569;
  }

  .form-group-notulen input,
  .form-group-notulen textarea {
    width: 100%;
    padding: 10px 12px;
    border-radius: 10px;
    border: 1px solid #CBD5E1;
    font-size: 12px;
    outline: none;
  }

  .form-group-notulen input:focus,
  .form-group-notulen textarea:focus {
    border-color: #00875A;
  }

  .modal-footer-btns {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 6px;
  }

  .btn-modal-cancel {
    background: #F1F5F9;
    color: #475569;
    border: none;
    border-radius: 10px;
    padding: 8px 14px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
  }

  .btn-modal-save {
    background: #00875A;
    color: #FFFFFF;
    border: none;
    border-radius: 10px;
    padding: 8px 16px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
  }
</style>

<div class="notulen-page-container">
  <div class="notulen-header">
    <div>
      <h2 class="notulen-title">Notulen Rapat</h2>
      <p class="notulen-subtitle">Catatan hasil musyawarah & keputusan pengurus RT/RW</p>
    </div>
    <button type="button" class="btn-tambah-notulen" id="btn-open-modal-notulen">
      <span>+ Notulen Baru</span>
    </button>
  </div>

  <!-- CONTAINER REALTIME NOTULEN -->
  <div class="notulen-cards-grid" id="container-notulen-list">
    <div style="text-align: center; color: #94A3B8; padding: 20px; font-style: italic; font-size: 12px;">
      Memuat data notulen...
    </div>
  </div>
</div>

<!-- MODAL FORM NOTULEN -->
<div class="modal-notulen-overlay" id="modal-notulen">
  <div class="modal-notulen-content">
    <div class="modal-header-text" id="modal-notulen-title">Tambah Notulen Rapat</div>
    
    <form id="form-notulen-rapat">
      <input type="hidden" id="notulen-doc-id">
      
      <div class="form-group-notulen">
        <label>Judul / Agenda Rapat *</label>
        <input type="text" id="notulen-agenda" placeholder="Contoh: Rapat Persiapan Kerja Bakti" required>
      </div>

      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px;">
        <div class="form-group-notulen">
          <label>Tanggal Rapat *</label>
          <input type="date" id="notulen-tgl" required>
        </div>
        <div class="form-group-notulen">
          <label>Lokasi Rapat</label>
          <input type="text" id="notulen-lokasi" placeholder="Contoh: Pos Ronda / Balai RT">
        </div>
      </div>

      <div class="form-group-notulen" style="margin-top: 10px;">
        <label>Pemimpin Rapat / Notulis</label>
        <input type="text" id="notulen-pemimpin" placeholder="Contoh: Pak RT / Sekretaris">
      </div>

      <div class="form-group-notulen" style="margin-top: 10px;">
        <label>Hasil & Keputusan Rapat *</label>
        <textarea id="notulen-isi" rows="5" placeholder="Tuliskan poin-poin hasil rapat di sini..." required></textarea>
      </div>

      <div class="modal-footer-btns">
        <button type="button" class="btn-modal-cancel" id="btn-close-modal-notulen">Batal</button>
        <button type="submit" class="btn-modal-save" id="btn-save-notulen">Simpan Notulen</button>
      </div>
    </form>
  </div>
</div>
