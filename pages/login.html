<div class="auth-card" id="auth-card-login">
  <h2>Masuk WargaTulung</h2>
  <p>Akses akun warga yang telah didaftarkan oleh Admin.</p>
  
  <div id="login-error-msg" class="hidden" style="background-color: #fef2f2; border: 1px solid #fecaca; color: #dc2626; padding: 10px 14px; border-radius: 12px; font-size: 12px; font-weight: 600; margin-bottom: 16px; display: flex; align-items: center; gap: 8px;">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
    <span id="login-error-text">Email atau kata sandi tidak sesuai. Silakan coba lagi.</span>
  </div>

  <form id="form-login">
    <div class="form-group">
      <label>Email Registered</label>
      <input type="email" id="login-email" class="form-control" placeholder="warga@tulung.id" required autocomplete="username">
    </div>

    <div class="form-group">
      <label>Kata Sandi</label>
      <div class="password-wrapper">
        <input type="password" id="login-password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
        <button type="button" class="toggle-password" id="btn-toggle-pass" aria-label="Lihat Password">
          <svg id="eye-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
        </button>
      </div>
    </div>

    <button type="submit" id="btn-submit-login" class="btn-primary">Masuk Aplikasi</button>
  </form>

  <div style="margin-top: 24px; text-align: center; font-size: 12px; color: var(--text-muted);">
    Copyright This-Application 2026
  </div>
</div>
