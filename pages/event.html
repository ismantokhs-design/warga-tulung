<style>
  .event-page-container {
    padding: 0 0 16px 0;
    margin-top: 0;
    animation: fadeInPage 0.2s ease-out;
  }

  @keyframes fadeInPage {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* TOPBAR DIBUAT DENGAN PADDING TOP 0 AGAR RAPE DAN MEPET KE ATAS SEPERTI PROFIL WILAYAH */
  .event-topbar-clean {
    background: #F8FAFC;
    padding: 0 0 10px 0; /* Hapus padding atas agar sejajar */
    margin-bottom: 4px;
  }

  .event-topbar-title {
    color: #00796B;
    font-size: 16px; /* Disesuaikan 16px sama persis dengan Profil Wilayah */
    font-weight: 800;
    letter-spacing: -0.2px;
    margin: 0;
    line-height: 1.2;
  }

  .event-topbar-subtitle {
    color: #64748B;
    font-size: 10.5px; /* Disesuaikan 10.5px sama persis dengan Profil Wilayah */
    font-weight: 400;
    line-height: 1.3;
    margin-top: 2px;
  }

  .event-filter-bar {
    background: #FFFFFF;
    border-radius: 12px;
    padding: 8px 12px;
    display: flex;
    align-items: center;
    gap: 8px;
    border: 1px solid #E2E8F0;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.02);
    margin-bottom: 12px;
  }

  .event-filter-icon {
    color: #059669;
    display: flex;
    align-items: center;
    flex-shrink: 0;
  }

  .event-filter-select {
    width: 100%;
    border: none;
    outline: none;
    background: transparent;
    font-size: 11.5px;
    font-weight: 600;
    color: #334155;
    cursor: pointer;
  }

  .event-cards-grid {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .event-display-card {
    background: #FFFFFF;
    border-radius: 16px;
    overflow: hidden;
    border: 1px solid #E2E8F0;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
    transition: transform 0.15s ease;
  }

  .event-card-banner {
    width: 100%;
    height: 130px;
    object-fit: cover;
    display: block;
    background-color: #E2E8F0;
  }

  .event-card-body {
    padding: 10px 12px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .event-card-date {
    font-size: 10px;
    color: #94A3B8;
    font-weight: 500;
  }

  .event-card-title {
    font-size: 14px;
    font-weight: 800;
    color: #0F172A;
    margin: 0;
    line-height: 1.25;
  }

  .event-card-desc {
    font-size: 11.5px;
    color: #64748B;
    line-height: 1.35;
    margin-top: 2px;
    margin-bottom: 6px;
  }

  .event-read-more {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 11px;
    font-weight: 700;
    color: #0A3966;
    text-decoration: none;
    cursor: pointer;
  }

  .event-read-more:hover {
    color: #059669;
  }

  .event-empty-box {
    background: #FFFFFF;
    border-radius: 14px;
    padding: 18px 12px;
    text-align: center;
    color: #94A3B8;
    font-size: 11.5px;
    font-style: italic;
    border: 1px solid #E2E8F0;
  }
</style>

<div class="event-page-container">
  <div class="event-topbar-clean">
    <h2 class="event-topbar-title">Event Terbaru</h2>
    <p class="event-topbar-subtitle">Dokumentasi dan informasi kegiatan warga RT</p>
  </div>

  <div class="event-filter-bar">
    <div class="event-filter-icon">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
        <line x1="16" y1="2" x2="16" y2="6"></line>
        <line x1="8" y1="2" x2="8" y2="6"></line>
        <line x1="3" y1="10" x2="21" y2="10"></line>
      </svg>
    </div>
    <select class="event-filter-select" id="filter-periode-event">
      <option value="semua">Semua Periode (Bulan & Tahun)</option>
      <option value="2026-10">Oktober 2026</option>
      <option value="2026-11">November 2026</option>
      <option value="2026-12">Desember 2026</option>
    </select>
  </div>

  <!-- CONTAINER UTAMA UNTUK EVENT -->
  <div class="event-cards-grid" id="public-events-list">
    <div class="event-empty-box">Memuat agenda kegiatan...</div>
  </div>
</div>
